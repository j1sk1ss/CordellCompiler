<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPLv3</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/buble.css" />

  <script>
    (function() {
      const route = (location.hash || '').split('?')[0].replace(/\/+$/, '');
      const isHome = !route || route === '#' || route === '#/' || route === '#/README' || route === '#/README.md';
      document.documentElement.classList.toggle('cpl-home-route', isHome);
    })();
  </script>

  <style>
    :root {
      --bg: #fbf8f4;
      --panel: #ffffff;
      --panel-soft: #f6efe8;
      --panel-muted: #eadfd6;
      --text: #2f2925;
      --muted: #6e6259;
      --line: #dfd3c8;
      --ink: #17110f;
      --ink-soft: #231a17;
      --ink-warm: #2a211d;
      --brand: #f46623;
      --brand-strong: #c74616;
      --brand-deep: #8a2f13;
      --brand-soft: #fff0e7;
      --shadow: 0 1px 2px rgba(47, 41, 37, 0.08);
      --extrude-side: #f46623;
      --extrude-bottom: #b63e14;
      --extrude-line: #17110f;
      --iso-depth: 8px;
      --content-max: 1080px;
      --radius: 4px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      z-index: 80;
      background: var(--brand);
    }

    .app-name {
      padding: 18px 18px 16px;
      border-bottom: 2px solid var(--brand);
      background: var(--ink);
    }

    .app-name-link {
      display: block;
      color: #ffffff !important;
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
      text-transform: uppercase;
    }

    .app-name-link small {
      display: block;
      margin-top: 7px;
      color: #c7beb5;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
    }

    .sidebar {
      background: var(--ink-soft);
      border-right: 0;
      box-shadow: none;
      padding-top: 4px;
    }

    .sidebar-nav {
      padding: 10px 0 28px;
      background: var(--ink-soft);
    }

    .sidebar-nav ul,
    .sidebar-nav li,
    .sidebar-nav li ul {
      background: transparent !important;
    }

    .sidebar-nav ul { margin: 0; padding-left: 0; }
    .sidebar-nav li { list-style: none; margin: 3px 0; }

    .sidebar-nav li > p {
      margin: 18px 0 8px;
      padding: 9px 18px 8px;
      color: #f4eee8;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.035);
    }

    .sidebar ul li a {
      display: block;
      padding: 9px 18px;
      margin: 0;
      border-radius: 0;
      color: #f4eee8;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 650;
      line-height: 1.35;
      border: 0;
      border-left: 4px solid transparent;
    }

    .sidebar ul li a:hover {
      background: rgba(255, 255, 255, 0.08);
      border-left-color: rgba(244, 102, 35, 0.55);
      color: #ffffff;
    }

    .sidebar ul li.active > a {
      background: #ffffff !important;
      color: var(--ink) !important;
      border-left-color: var(--brand);
      font-weight: 800;
    }

    .sidebar ul li ul {
      margin-top: 4px;
      margin-left: 0;
      padding-left: 0;
      border-left: 0;
    }

    .sidebar ul li ul a {
      padding-left: 30px;
      font-size: 0.9rem;
      color: #d8cfc6;
    }

    .search {
      margin: 12px 18px 10px;
      padding: 0;
      border-bottom: 0;
      background: transparent;
    }

    .search input {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 0;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 0.94rem;
      outline: none;
      box-shadow: none;
    }

    .search input:focus {
      border-color: var(--brand);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(244, 102, 35, 0.20);
    }

    .search input::placeholder { color: #c7beb5; }
    .search .results-panel {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 0;
      box-shadow: var(--shadow);
    }
    .search .matching-post { border-bottom-color: var(--line); }
    .search .matching-post:last-child { border-bottom: 0; }

    .app-nav {
      position: fixed;
      top: 4px;
      right: 0;
      left: 300px;
      z-index: 60;
      height: 56px;
      margin: 0;
      padding: 0 34px;
      background: var(--ink);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .app-nav ul {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .app-nav li { margin: 0; }

    .app-nav a {
      display: inline-flex;
      align-items: center;
      min-height: 56px;
      padding: 0 12px;
      color: #f7eee7 !important;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      text-decoration: none !important;
      letter-spacing: 0.02em;
      border-bottom: 3px solid transparent;
    }

    .app-nav a:hover {
      color: #ffffff !important;
      border-bottom-color: var(--brand);
      background: rgba(255, 255, 255, 0.06);
    }

    .content { padding-top: 60px; }

    html.cpl-home-route .sidebar,
    html.cpl-home-route .sidebar-toggle,
    body.cpl-home-route .sidebar,
    body.cpl-home-route .sidebar-toggle {
      display: none;
    }

    html.cpl-home-route .app-nav,
    body.cpl-home-route .app-nav {
      left: 0;
    }

    html.cpl-home-route .content,
    body.cpl-home-route .content {
      left: 0;
    }

    .markdown-section {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 48px 56px 84px;
      color: var(--text);
      background: #fff;
      border-left: 1px solid rgba(216, 199, 184, 0.55);
      border-right: 1px solid rgba(216, 199, 184, 0.55);
    }

    .markdown-section > *:first-child { margin-top: 0 !important; }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--text);
      letter-spacing: 0;
      font-weight: 800;
    }

    .markdown-section h1 {
      font-size: clamp(2.45rem, 5vw, 3.85rem);
      line-height: 1.02;
      margin-bottom: 0.46em;
      text-wrap: balance;
    }

    .markdown-section h2 {
      margin-top: 2.3em;
      padding-top: 0.5em;
      border-top: 2px solid var(--ink);
      font-size: 1.75rem;
    }

    .markdown-section p,
    .markdown-section li,
    .markdown-section blockquote {
      color: var(--text);
      font-size: 1rem;
      line-height: 1.75;
    }

    .markdown-section strong { color: var(--text); }
    .markdown-section em { color: var(--muted); }

    .change-date {
      display: block;
      margin: -0.25rem 0 0.85rem;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.35;
    }

    .markdown-section a {
      color: var(--brand-deep);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.16em;
    }

    .markdown-section blockquote {
      border-left: 5px solid var(--brand);
      background: var(--panel-soft);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 12px 16px;
    }

    .markdown-section code {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border: 1px solid #f4c7ae;
      border-radius: 4px;
      padding: 0.18em 0.45em;
    }

    .markdown-section pre {
      position: relative;
      background: #1f1b18 !important;
      border: 1px solid #1f1b18;
      border-radius: var(--radius);
      padding: 18px 16px 16px !important;
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .markdown-section pre code {
      background: transparent;
      border: 0;
      padding: 0;
      color: #f9f2ec;
      font-size: 0.94rem;
      line-height: 1.58;
    }

    .markdown-section pre[data-lang]::before {
      content: attr(data-lang);
      position: absolute;
      top: 0;
      right: 0;
      padding: 3px 8px 4px;
      background: rgba(244, 102, 35, 0.16);
      border-left: 1px solid rgba(244, 102, 35, 0.28);
      border-bottom: 1px solid rgba(244, 102, 35, 0.28);
      color: #f2c7b2;
      font-size: 0.68rem;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .token.comment { color: #9b8f86; font-style: italic; }
    .token.string,
    .token.char { color: #d9b889; }
    .token.keyword { color: #ff8752; font-weight: 700; }
    .token.type { color: #f3d26a; }
    .token.number { color: #9fd6ff; }
    .token.operator,
    .token.punctuation { color: #e6d7ca; }
    .token.annotation,
    .token.preprocessor { color: #b8e986; }
    .token.function { color: #8ecae6; }

    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }

    .markdown-section th,
    .markdown-section td {
      border: 0 !important;
      border-bottom: 1px solid var(--line) !important;
      padding: 12px 14px;
    }

    .markdown-section tr:last-child td { border-bottom: 0 !important; }
    .markdown-section th {
      background: var(--ink);
      color: #ffffff;
    }

    .cpl-home {
      margin: -48px -56px 0;
      color: var(--text);
      background: #fff;
    }

    .cpl-home-hero {
      display: block;
      min-height: 420px;
      padding: 74px 56px 64px;
      background: var(--ink);
      border-bottom: 4px solid var(--brand);
    }

    .cpl-home-hero h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(3.5rem, 8vw, 7rem);
      line-height: 0.92;
      letter-spacing: 0;
      max-width: 760px;
    }

    .cpl-home-hero h1::after {
      content: "";
      display: block;
      width: 84px;
      height: 6px;
      margin-top: 24px;
      background: var(--brand);
    }

    .hero-kicker {
      display: inline-block;
      margin-bottom: 20px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: var(--brand);
      font-size: 0.86rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .hero-note {
      max-width: 760px;
      margin: 28px 0 28px;
      color: #efe4dc !important;
      font-size: 1.26rem !important;
      line-height: 1.62 !important;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 18px 0 24px;
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 0;
      text-decoration: none !important;
      font-weight: 800;
      border: 1px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      box-shadow: none;
      position: relative;
      z-index: 0;
      isolation: isolate;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.18s ease;
    }

    .hero-button::before,
    .hero-button::after,
    .doc-card::before,
    .doc-card::after,
    .feature-card::before,
    .feature-card::after,
    .docsify-pagination-card::before,
    .docsify-pagination-card::after,
    .cpl-runner-button::before,
    .cpl-runner-button::after {
      content: "";
      position: absolute;
      z-index: -1;
      opacity: 1;
      border: 1px solid var(--extrude-line);
      pointer-events: none;
    }

    .hero-button::before,
    .doc-card::before,
    .feature-card::before,
    .docsify-pagination-card::before,
    .cpl-runner-button::before {
      top: -1.5px;
      left: calc(100% - 1px);
      width: calc(var(--iso-depth) + 1px);
      height: calc(100% + var(--iso-depth) + 1px);
      background: var(--extrude-side);
      border-left: 0;
      clip-path: polygon(
        0 0,
        100% var(--iso-depth),
        100% calc(100% - 1px),
        0 calc(100% - var(--iso-depth) - 1px)
      );
      -webkit-mask: linear-gradient(#000 0 0) left / 0 100% no-repeat;
      mask: linear-gradient(#000 0 0) left / 0 100% no-repeat;
      transition: -webkit-mask-size 0.18s ease, mask-size 0.18s ease;
    }

    .hero-button::after,
    .doc-card::after,
    .feature-card::after,
    .docsify-pagination-card::after,
    .cpl-runner-button::after {
      top: calc(100% - 1px);
      left: -2.7px;
      width: calc(100% + var(--iso-depth) + 3px);
      height: calc(var(--iso-depth) + 1px);
      background: var(--extrude-bottom);
      border-top: 0;
      clip-path: polygon(
        1px 0,
        calc(100% - var(--iso-depth) - 1px) 0,
        100% 100%,
        calc(var(--iso-depth) + 1px) 100%
      );
      -webkit-mask: linear-gradient(#000 0 0) top / 100% 0 no-repeat;
      mask: linear-gradient(#000 0 0) top / 100% 0 no-repeat;
      transition: -webkit-mask-size 0.18s ease, mask-size 0.18s ease;
    }

    .hero-button:hover,
    .doc-card:hover,
    .feature-card:hover,
    .docsify-pagination-card:hover,
    .cpl-runner-button:hover {
      transform: translate(calc(var(--iso-depth) * -1), calc(var(--iso-depth) * -1));
    }

    .hero-button:hover::before,
    .doc-card:hover::before,
    .feature-card:hover::before,
    .docsify-pagination-card:hover::before,
    .cpl-runner-button:hover::before,
    .hero-button:hover::after,
    .doc-card:hover::after,
    .feature-card:hover::after,
    .docsify-pagination-card:hover::after,
    .cpl-runner-button:hover::after {
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }

    .hero-button.primary {
      background: var(--brand);
      color: #111111 !important;
    }

    .hero-button.primary:hover {
      background: #ff7a3d;
    }

    .hero-button.secondary {
      background: #fff;
      color: var(--text) !important;
      border-color: #fff;
    }

    .hero-button.secondary:hover {
      background: var(--panel-soft);
    }

    .cpl-command {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      max-width: 560px;
      margin-top: 22px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #0f0b0a;
      color: #f9f2ec;
      font: 0.94rem/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .cpl-command span {
      color: var(--brand);
      font-weight: 800;
    }

    .cpl-command code {
      padding: 0;
      border: 0;
      background: transparent;
      color: #f9f2ec;
      overflow-wrap: anywhere;
    }

    .cpl-home-band {
      padding: 52px 56px 58px;
      background: var(--bg);
      color: var(--text);
      border-bottom: 1px solid var(--line);
    }

    .cpl-home-band.dark {
      background: #fff;
      color: var(--text);
    }

    .cpl-home-band h2 {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
      color: inherit;
      max-width: 760px;
      font-size: clamp(1.9rem, 3vw, 2.9rem);
      line-height: 1.08;
      text-transform: none;
    }

    .cpl-home-band.dark p,
    .cpl-home-band.dark li {
      color: var(--muted);
    }

    .hero-kicker {
      display: inline-block;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .doc-card {
      display: block;
      padding: 18px;
      border-radius: 0;
      border: 1px solid var(--line);
      background: #fff;
      color: inherit !important;
      text-decoration: none !important;
      box-shadow: none;
      position: relative;
      z-index: 0;
      isolation: isolate;
      transition: border-color 0.14s ease, transform 0.18s ease;
    }

    .doc-card:hover {
      border-color: var(--ink);
    }

    .doc-card h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
      color: var(--ink);
    }

    .doc-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .feature-card {
      padding: 22px;
      border-left: 4px solid var(--brand);
      background: #fff;
      color: var(--text);
      box-shadow: none;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 0;
      isolation: isolate;
      transition: border-color 0.14s ease, transform 0.18s ease;
    }

    .feature-card:hover {
      border-top-color: var(--ink);
      border-right-color: var(--ink);
      border-bottom-color: var(--ink);
    }

    .feature-card h3 {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: 1.16rem;
      text-transform: uppercase;
    }

    .feature-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.62;
    }

    .section-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .docsify-pagination-container {
      margin: 42px 0 16px;
      padding-top: 8px;
      border-top: 2px solid var(--ink);
    }

    .docsify-pagination {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .docsify-pagination-card,
    .docsify-pagination-current {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 14px 16px;
      position: relative;
      z-index: 0;
      isolation: isolate;
      transition: border-color 0.14s ease, transform 0.18s ease;
    }

    .docsify-pagination-card:hover {
      border-color: var(--ink);
    }

    .docsify-pagination-card.right { text-align: right; }

    .docsify-pagination-label,
    .docsify-pagination-index {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .docsify-pagination-link,
    .docsify-pagination-title {
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      line-height: 1.35;
    }

    .docsify-pagination-link:hover { color: var(--brand-strong); }

    .docsify-pagination-current {
      min-width: 220px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .sidebar-toggle {
      background: var(--ink);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .sidebar-toggle span { background: var(--brand); }

    .docsify-copy-code-button {
      border-radius: 4px !important;
      border: 1px solid #4a4039 !important;
      background: #2a2521 !important;
      color: #fff !important;
      right: 12px !important;
      top: 12px !important;
    }

    .benchmark-card {
      margin: 24px 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .benchmark-chart-wrap {
      position: relative;
      width: 100%;
      height: 420px;
    }

    .benchmark-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .benchmark-chart {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .cpl-runner {
      margin: 24px 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .cpl-runner-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .cpl-runner-toolbar-left,
    .cpl-runner-toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;

    }

    .cpl-runner-title {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .cpl-runner-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--brand-soft);
      color: var(--brand-deep);
      font-size: 0.79rem;
      font-weight: 700;

    .cpl-runner-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--brand);
      color: #111111;
      font-weight: 800;
      cursor: pointer;
      position: relative;
      z-index: 0;
      isolation: isolate;
      transition: background 0.14s ease, border-color 0.14s ease, opacity 0.15s ease, transform 0.18s ease;

    .cpl-runner-button:hover {
      background: #ff7a3d;
    }
    .cpl-runner-button:disabled { opacity: 0.7; cursor: wait; }

    .cpl-runner-button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--ink);
    }

    .cpl-runner-button.secondary:hover { background: var(--panel-soft); }

    .cpl-runner-editor-shell {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--panel-soft);
    }

    .cpl-runner-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .cpl-runner-tab {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius) var(--radius) 0 0;
      background: #fff;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .cpl-runner-editor {
      width: 100%;
      height: 320px;
    }

    .cpl-runner-output {
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #1f1b18;
      color: #f9f2ec;
      min-height: 72px;
      white-space: pre-wrap;
      overflow-x: auto;
      font: 0.92rem/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .cpl-runner-output.is-error {
      border-color: #f4a582;
      background: #fff0e7;
      color: var(--brand-deep);
    }

    @media (max-width: 900px) {
      .app-nav {
        left: 0;
        height: auto;
        min-height: 52px;
        padding: 0 16px;
      }
      .app-nav ul {
        justify-content: flex-start;
        overflow-x: auto;
      }
      .app-nav a {
        min-height: 52px;
        white-space: nowrap;
      }
      .content { padding-top: 58px; }
      .markdown-section { padding: 34px 22px 72px; }
      .cpl-home { margin: -34px -22px 0; }
      .cpl-home-hero {
        min-height: auto;
        padding: 48px 22px 46px;
      }
      .cpl-home-band { padding: 34px 22px 42px; }
      .feature-grid { grid-template-columns: 1fr; }
      .docsify-pagination { grid-template-columns: 1fr; }
      .docsify-pagination-card.right { text-align: left; }
      .docsify-pagination-current { min-width: 0; }
      .benchmark-chart-wrap { height: 320px; }
      .cpl-runner-editor { height: 260px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-button,
      .doc-card,
      .feature-card,
      .docsify-pagination-card,
      .cpl-runner-button,
      .hero-button::before,
      .hero-button::after,
      .doc-card::before,
      .doc-card::after,
      .feature-card::before,
      .feature-card::after,
      .docsify-pagination-card::before,

      }

      .hero-button:hover,
      .doc-card:hover,
      .feature-card:hover,
      .docsify-pagination-card:hover,
      .cpl-runner-button:hover,
      .hero-button:hover::before,
      .doc-card:hover::before,
      .feature-card:hover::before,
      .docsify-pagination-card:hover::before,
      .cpl-runner-button:hover::before,
      .hero-button:hover::after,
      .doc-card:hover::after,
      .feature-card:hover::after,
      .docsify-pagination-card:hover::after,
      .cpl-runner-button:hover::after {
        transform: none;
      }

      .hero-button:hover::before,
      .doc-card:hover::before,
      .feature-card:hover::before,
      .docsify-pagination-card:hover::before,
      .cpl-runner-button:hover::before,
      .hero-button:hover::after,
      .doc-card:hover::after,
      .feature-card:hover::after,
      .docsify-pagination-card:hover::after,
      .cpl-runner-button:hover::after {
        -webkit-mask-size: 0 0;
        mask-size: 0 0;
      }
    }

<body>
  <div id="app"></div>
  <script>
    window.CPL_RUNNER_URL = window.CPL_RUNNER_URL || (
      /^(127\.0\.0\.1|localhost)$/.test(location.hostname)
        ? 'http://127.0.0.1:8000/cpl/run'
        : '/cpl/run'
    );
    window.CPL_RUNNER_STUB = window.CPL_RUNNER_STUB || async function(payload) {
      await new Promise(resolve => setTimeout(resolve, 280));
      return {
        success: true,
        stdout: [
          '=== backend stub ===',
          'POST ' + window.CPL_RUNNER_URL,
          'Compilation and execution endpoint is not connected in this environment yet.',
          '',
          'Payload accepted:',
          '- lang: ' + payload.lang,
          '- code size: ' + payload.code.length + ' bytes',
          '',
          'Production backend should return stdout/stderr/compiler metadata with the same JSON shape.'
        ].join('\n'),
        stderr: '',
        compiler_exit_code: 0,
        program_exit_code: 0
      };
    };
  </script>
  <script>
    function cleanRoute(route) {
      if (!route) return '';
      let value = route;
      try {
        const url = new URL(route, window.location.origin);
        value = url.hash || route;
      } catch (e) {}
      value = value.split('?')[0];
      value = value.replace(/\/+$/, '');
      return value;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function spanToken(type, value) {
      return '<span class="token ' + type + '">' + escapeHtml(value) + '</span>';
    }

    function highlightCpl(code) {
      const keywords = new Set([
        'as', 'break', 'case', 'default', 'else', 'exit', 'extern', 'function',
        'glob', 'if', 'loop', 'return', 'ro', 'start', 'switch', 'while'
      ]);
      const types = new Set([
        'arr', 'dref', 'f32', 'f64', 'i0', 'i8', 'i16', 'i32', 'i64',
        'ptr', 'ref', 'str', 'u8', 'u16', 'u32', 'u64'
      ]);
      const builtins = new Set(['asm', 'sizeof', 'syscall']);

      let out = '';
      let i = 0;

      while (i < code.length) {
        const rest = code.slice(i);

        if (rest.startsWith(':/')) {
          const end = code.indexOf('/:', i + 2);
          const value = end === -1 ? code.slice(i) : code.slice(i, end + 2);
          out += spanToken('comment', value);
          i += value.length;
          continue;
        }

        if (code[i] === ':' && (i === 0 || code[i - 1] === '\n' || /\s/.test(code[i - 1]))) {
          const end = code.indexOf(':', i + 1);
          const newline = code.indexOf('\n', i + 1);
          if (end !== -1 && (newline === -1 || end < newline)) {
            const value = code.slice(i, end + 1);
            out += spanToken('comment', value);
            i += value.length;
            continue;
          }
        }

        if (code[i] === '#') {
          const end = code.indexOf('\n', i + 1);
          const value = end === -1 ? code.slice(i) : code.slice(i, end);
          out += spanToken('preprocessor', value);
          i += value.length;
          continue;
        }

        if (rest.startsWith('@[')) {
          const end = code.indexOf(']', i + 2);
          const value = end === -1 ? code.slice(i) : code.slice(i, end + 1);
          out += spanToken('annotation', value);
          i += value.length;
          continue;
        }

        if (code[i] === '"' || code[i] === "'") {
          const quote = code[i];
          let j = i + 1;
          while (j < code.length) {
            if (code[j] === '\\') {
              j += 2;
              continue;
            }
            if (code[j] === quote) {
              j += 1;
              break;
            }
            j += 1;
          }
          out += spanToken(quote === '"' ? 'string' : 'char', code.slice(i, j));
          i = j;
          continue;
        }

        const number = rest.match(/^(0[xX][0-9a-fA-F]+|0[bB][01]+|[0-9]+(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)/);
        if (number) {
          out += spanToken('number', number[0]);
          i += number[0].length;
          continue;
        }

        const word = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
        if (word) {
          const value = word[0];
          const next = code.slice(i + value.length).match(/^\s*\(/);
          if (keywords.has(value)) out += spanToken('keyword', value);
          else if (types.has(value)) out += spanToken('type', value);
          else if (builtins.has(value)) out += spanToken('keyword', value);
          else if (next) out += spanToken('function', value);
          else out += escapeHtml(value);
          i += value.length;
          continue;
        }

        const op = rest.match(/^(=>|->|==|!=|<=|>=|\+=|-=|\*=|\/=|%=|&&|\|\||[{}\(\)\[\],.;:+\-*\/%=&|!<>])/);
        if (op) {
          out += spanToken(/[{}()[\],.;:]/.test(op[0]) ? 'punctuation' : 'operator', op[0]);
          i += op[0].length;
          continue;
        }

        out += escapeHtml(code[i]);
        i += 1;
      }

      return out;
    }

    function highlightCode(code, lang) {
      const normalized = (lang || 'markup').toLowerCase();
      if (normalized === 'cpl') return highlightCpl(code);

      if (window.Prism && Prism.languages && Prism.languages[normalized]) {
        return Prism.highlight(code, Prism.languages[normalized], normalized);
      }

      return escapeHtml(code);
    }

    window.__benchmarkCharts = new Map();

    function destroyBenchmarkCharts() {
      for (const chart of window.__benchmarkCharts.values()) {
        chart.destroy();
      }
      window.__benchmarkCharts.clear();
    }

    function renderBenchmarkCharts() {
      if (typeof Chart === 'undefined') return;
    
      destroyBenchmarkCharts();
    
      const cards = document.querySelectorAll('.benchmark-card');
      console.log('cards=', document.querySelectorAll('.benchmark-card').length);
      for (const card of cards) {
        const canvas = card.querySelector('canvas.benchmark-chart');
        console.log('card=', card, 'canvas=', canvas, 'dataset=', card.dataset);
        if (!canvas) continue;
    
        try {
          let cfg = null;
    
          const dataNode = card.querySelector('textarea.benchmark-data');
          if (dataNode) {
            cfg = JSON.parse(dataNode.value || dataNode.textContent);
          } else {
            const labels= (card.dataset.labels || '').split('|').map(x => x.trim()).filter(Boolean);
            const values= (card.dataset.values || '').split('|').map(x => Number(x.trim())).filter(x => !Number.isNaN(x));
    
            cfg = {
              title: card.dataset.title || '',
              labels: labels,
              datasets: [{
                label: card.dataset.datasetLabel || 'Value',
                data: values,
                borderWidth: 1,
                borderRadius: 8,
                maxBarThickness: 72
              }],
              yLabel: card.dataset.yLabel || card.dataset.datasetLabel || 'Value',
              tooltipSuffix: card.dataset.tooltipSuffix || ''
            };
          }
    
          if (!cfg.labels || !cfg.labels.length || !cfg.datasets || !cfg.datasets.length) {
            throw new Error('Empty benchmark config');
          }
    
          const datasets = cfg.datasets.map(ds => ({
            borderWidth: 1,
            borderRadius: 8,
            maxBarThickness: 72,
            ...ds
          }));
    
          const chart = new Chart(canvas.getContext('2d'), {
            type: cfg.type || 'bar',
            data: {
              labels: cfg.labels,
              datasets: datasets
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: {
                mode: 'index',
                intersect: false
              },
              plugins: {
                legend: {
                  display: true,
                  position: 'top'
                },
                title: {
                  display: !!cfg.title,
                  text: cfg.title || ''
                },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      const suffix = cfg.tooltipSuffix || '';
                      const raw = context.parsed.y ?? context.raw;
                      const value = typeof raw === 'number' ? raw.toFixed(6) : raw;
                      return `${context.dataset.label}: ${value}${suffix}`;
                    }
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  title: {
                    display: true,
                    text: cfg.yLabel || cfg.datasetLabel || 'Value'
                  }
                }
              }
            }
          });
    
          window.__benchmarkCharts.set(canvas, chart);
        } catch (err) {
          const wrap = card.querySelector('.benchmark-chart-wrap');
          if (wrap) {
            wrap.innerHTML = `<div class="benchmark-note">Chart error: ${err.message}</div>`;
          }
          console.error(err);
        }
      }
    }

    window.$docsify = {
      name: 'CPL v3.5<small>Language docs & compiler internals</small>',
      repo: 'https://github.com/j1sk1ss/CordellCompiler',
      homepage: 'README.md',
      loadSidebar: 'sidebar.md',
      loadNavbar: 'navbar.md',
      mergeNavbar: true,
      requestHeaders: {
        'cache-control': 'no-cache'
      },
      alias: {
        '/.*/sidebar.md': 'sidebar.md',
        '/.*/navbar.md': 'navbar.md'
      },
      subMaxLevel: 2,
      maxLevel: 3,
      routerMode: 'hash',
      auto2top: true,
      topMargin: 24,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No results found',
        depth: 3,
        hideOtherSidebarContent: false,
        namespace: 'cpl-docs-pages-v2'
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'cpl-run') {
              const encoded = encodeURIComponent(code);
              return `
                <div class="cpl-runner" data-lang="cpl" data-code="${encoded}">
                  <div class="cpl-runner-toolbar">
                    <div class="cpl-runner-toolbar-left">
                      <div class="cpl-runner-title">CPL playground</div>
                      <span class="cpl-runner-badge">Compile and run via backend</span>
                    </div>
                    <div class="cpl-runner-toolbar-right">
                      <button class="cpl-runner-button secondary" type="button" data-action="format">Format</button>
                      <button class="cpl-runner-button" type="button" data-action="run">Run</button>
                    </div>
                  </div>
                  <div class="cpl-runner-editor-shell">
                    <div class="cpl-runner-tabs">
                      <span class="cpl-runner-tab">main.cpl</span>
                    </div>
                    <div class="cpl-runner-editor"></div>
                  </div>
                  <pre class="cpl-runner-output">Ready to run. The browser will POST this code to the CPL backend.</pre>
                </div>
              `;
            }

            const language = String(lang || 'markup').toLowerCase();
            return '<pre data-lang="' + escapeHtml(language) + '"><code class="language-' + escapeHtml(language) + '">' + highlightCode(code, language) + '</code></pre>';
          }
        }
      },
      plugins: [
        function(hook) {
          function updateShellRoute() {
            const route = cleanRoute(location.hash);
            const isHome = !route || route === '#' || route === '#/' || route === '#/README' || route === '#/README.md';
            document.documentElement.classList.toggle('cpl-home-route', isHome);
            document.body.classList.toggle('cpl-home-route', isHome);
          }

          hook.ready(updateShellRoute);
          hook.doneEach(updateShellRoute);
          window.addEventListener('hashchange', updateShellRoute);
        },

        function(hook) {
          const pagePrefix = '#/pages/';

          function getPageLinks() {
            const nav = document.querySelector('.sidebar-nav');
            if (!nav) return [];
            const seen = new Set();
            return Array.from(nav.querySelectorAll('a'))
              .map(a => ({
                href: cleanRoute(a.getAttribute('href') || ''),
                title: (a.textContent || '').trim()
              }))
              .filter(item => item.href.startsWith(pagePrefix))
              .filter(item => {
                if (!item.href || seen.has(item.href)) return false;
                seen.add(item.href);
                return true;
              });
          }

          function removePager() {
            const old = document.querySelector('.docsify-pagination-container');
            if (old) old.remove();
          }

          function normalizeHash(href) {
            if (!href) return '';
            try {
              const url = new URL(href, window.location.origin);
              let hash = url.hash || href;
              hash = hash.replace(/\.md([?#].*)?$/, '');
              return hash;
            } catch (e) {
              return href.replace(/\.md([?#].*)?$/, '');
            }
          }

          function renderPager() {
            removePager();

            const currentHash = normalizeHash(location.hash);
            if (!currentHash.startsWith(pagePrefix)) return;

            const items = getPageLinks();
            if (!items.length) return;

            const currentIndex = items.findIndex(item => item.href === currentHash);
            if (currentIndex === -1) return;

            const prev = items[currentIndex - 1];
            const current = items[currentIndex];
            const next = items[currentIndex + 1];
            const article = document.querySelector('.content .markdown-section');
            if (!article) return;

            const wrap = document.createElement('div');
            wrap.className = 'docsify-pagination-container';
            wrap.innerHTML = `
              <div class="docsify-pagination">
                ${prev ? `<div class="docsify-pagination-card left"><div class="docsify-pagination-label">Previous</div><a class="docsify-pagination-link" href="${prev.href}">← ${prev.title}</a></div>` : '<div></div>'}
                <div class="docsify-pagination-current">
                  <div class="docsify-pagination-index">${currentIndex + 1} / ${items.length}</div>
                  <div class="docsify-pagination-title">${current.title}</div>
                </div>
                ${next ? `<div class="docsify-pagination-card right"><div class="docsify-pagination-label">Next</div><a class="docsify-pagination-link" href="${next.href}">${next.title} →</a></div>` : '<div></div>'}
              </div>
            `;
            article.appendChild(wrap);
          }

          hook.doneEach(function() {
            setTimeout(renderPager, 120);
          });

          window.addEventListener('hashchange', function() {
            setTimeout(renderPager, 120);
          });
        },

        function(hook) {
          const editors = new Map();
          let monacoReadyPromise = null;

          function decodeCode(value) {
            try {
              return decodeURIComponent(value || '');
            } catch (e) {
              return value || '';
            }
          }

          function ensureMonaco() {
            if (window.monaco && window.require) return Promise.resolve(window.monaco);
            if (monacoReadyPromise) return monacoReadyPromise;

            monacoReadyPromise = new Promise((resolve, reject) => {
              const finish = () => {
                try {
                  window.require.config({
                    paths: {
                      vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs'
                    }
                  });
                  window.MonacoEnvironment = {
                    getWorkerUrl: function() {
                      return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(`self.MonacoEnvironment={baseUrl:"https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/"};importScripts("https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js");`);
                    }
                  };
                  window.require(['vs/editor/editor.main'], function() {
                    resolve(window.monaco);
                  }, reject);
                } catch (err) {
                  reject(err);
                }
              };

              if (window.require && window.require.config) {
                finish();
                return;
              }

              const script = document.createElement('script');
              script.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js';
              script.onload = finish;
              script.onerror = () => reject(new Error('Failed to load Monaco loader'));
              document.head.appendChild(script);
            });

            return monacoReadyPromise;
          }

          function registerCplLanguage(monaco) {
            if (window.__cplMonacoRegistered) return;
            window.__cplMonacoRegistered = true;

            monaco.languages.register({ id: 'cpl' });

            monaco.languages.setMonarchTokensProvider('cpl', {
              tokenizer: {
                root: [
                  [/:\//, 'comment', '@comment_block_slash'],
                  [/:(?=\s|$)/, 'comment', '@comment_block_colon'],
                  [/:([^:\n]|\\:)*:/, 'comment'],
                  [/"([^"\\]|\\.)*$/, 'string.invalid'],
                  [/"/, 'string', '@string_double'],
                  [/'([^'\\]|\\.)*$/, 'string.invalid'],
                  [/'/, 'string', '@string_single'],
                  [/\b(f64|f32|i64|i32|i16|i8|u64|u32|u16|u8|i0|str|arr|dref|ref|ptr)\b/, 'type'],
                  [/\b(as|extern|start|exit|function|return|if|else|while|switch|case|default|syscall|asm|not|ro|glob|lis|break|loop)\b/, 'keyword'],
                  [/\b(0[xX][0-9a-fA-F]+|0[bB][01]+|0[0-7]+|[0-9]*\.?[0-9]+([eE][+-]?[0-9]+)?)\b/, 'number'],
                  [/[a-zA-Z_][\w]*/, 'identifier'],
                  [/[{}()\[\]]/, '@brackets'],
                  [/[-+*/%=!<>|&.,;]/, 'delimiter']
                ],
                comment_block_slash: [
                  [/\/:/, 'comment', '@pop'],
                  [/./, 'comment'],
                  [/\n/, 'comment']
                ],
                comment_block_colon: [
                  [/^:/, 'comment', '@pop'],
                  [/./, 'comment'],
                  [/\n/, 'comment']
                ],
                string_double: [
                  [/[^\\"]+/, 'string'],
                  [/\\./, 'string.escape'],
                  [/"/, 'string', '@pop']
                ],
                string_single: [
                  [/[^\\']+/, 'string'],
                  [/\\./, 'string.escape'],
                  [/'/, 'string', '@pop']
                ]
              }
            });

            monaco.languages.setLanguageConfiguration('cpl', {
              comments: { blockComment: [':', ':'] },
              brackets: [['{', '}'], ['[', ']'], ['(', ')']],
              autoClosingPairs: [
                { open: '{', close: '}' },
                { open: '[', close: ']' },
                { open: '(', close: ')' },
                { open: '"', close: '"' },
                { open: "'", close: "'" }
              ],
              surroundingPairs: [
                { open: '{', close: '}' },
                { open: '[', close: ']' },
                { open: '(', close: ')' },
                { open: '"', close: '"' },
                { open: "'", close: "'" }
              ]
            });

            monaco.languages.registerCompletionItemProvider('cpl', {
              provideCompletionItems: function() {
                const keywords = ['as','extern','from','import','start','exit','function','return','if','else','while','switch','case','default','syscall','asm','not','ro','glob','lis','break','loop'];
                const types = ['f64','f32','i64','i32','i16','i8','u64','u32','u16','u8','i0','str','arr','dref','ref','ptr','exfunc'];
                const snippets = [
                  {
                    label: 'function',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'function ${1:name}(${2}) {\n\t$0\n}',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    documentation: 'Function declaration'
                  },
                  {
                    label: 'if',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'if ${1:condition} {\n\t$0\n}',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    documentation: 'If block'
                  },
                  {
                    label: 'while',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'while ${1:condition} {\n\t$0\n}',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    documentation: 'While loop'
                  },
                  {
                    label: 'switch',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'switch ${1:value} {\n\tcase ${2:key}:\n\t\t$0\n\tdefault:\n\t\tbreak\n}',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    documentation: 'Switch block'
                  }
                ];

                const suggestions = [
                  ...keywords.map(label => ({ label, kind: monaco.languages.CompletionItemKind.Keyword, insertText: label })),
                  ...types.map(label => ({ label, kind: monaco.languages.CompletionItemKind.TypeParameter, insertText: label })),
                  ...snippets
                ];
                return { suggestions };
              }
            });

            monaco.editor.defineTheme('cpl-light', {
              base: 'vs-dark',
              inherit: true,
              rules: [
                { token: 'keyword', foreground: 'f46623', fontStyle: 'bold' },
                { token: 'type', foreground: 'ffc832' },
                { token: 'comment', foreground: 'a99b8f' },
                { token: 'string', foreground: 'd6b28d' },
                { token: 'number', foreground: 'f7d774' }
              ],
              colors: {
                'editor.background': '#1f1b18',
                'editor.foreground': '#f9f2ec',
                'editorLineNumber.foreground': '#8c7f74',
                'editorLineNumber.activeForeground': '#f46623',
                'editorIndentGuide.background1': '#3a312b',
                'editor.selectionBackground': '#6b3a24',
                'editor.inactiveSelectionBackground': '#3a2a22'
              }
            });
          }

          function simpleFormat(value) {
            const lines = value.replace(/\r\n/g, '\n').split('\n');
            let indent = 0;
            return lines.map(line => {
              const trimmed = line.trim();
              if (!trimmed) return '';
              if (/^[}\]]/.test(trimmed)) indent = Math.max(indent - 1, 0);
              const result = '\t'.repeat(indent) + trimmed;
              const opens = (trimmed.match(/[\{\[]/g) || []).length;
              const closes = (trimmed.match(/[\}\]]/g) || []).length;
              indent = Math.max(indent + opens - closes, 0);
              return result;
            }).join('\n');
          }

          async function initRunner(block) {
            if (!block || block.dataset.monacoReady === '1') return;
            block.dataset.monacoReady = '1';

            const editorMount = block.querySelector('.cpl-runner-editor');
            const output = block.querySelector('.cpl-runner-output');
            const code = decodeCode(block.dataset.code || '');

            try {
              const monaco = await ensureMonaco();
              registerCplLanguage(monaco);

              const model = monaco.editor.createModel(code, 'cpl');
              const editor = monaco.editor.create(editorMount, {
                model,
                theme: 'cpl-light',
                automaticLayout: true,
                minimap: { enabled: false },
                scrollBeyondLastLine: false,
                fontSize: 14,
                lineHeight: 22,
                tabSize: 2,
                insertSpaces: false,
                detectIndentation: false,
                wordWrap: 'on',
                quickSuggestions: true,
                suggestOnTriggerCharacters: true,
                tabCompletion: 'on',
                snippetSuggestions: 'inline',
                acceptSuggestionOnEnter: 'on',
                formatOnPaste: true,
                formatOnType: true,
                roundedSelection: false,
                padding: { top: 12, bottom: 12 }
              });

              editors.set(block, editor);

              const resizeObserver = new ResizeObserver(() => editor.layout());
              resizeObserver.observe(block);
              block.__resizeObserver = resizeObserver;

              output.textContent = 'Click \'Run\' to compile and run the program.';
            } catch (err) {
              output.classList.add('is-error');
              output.textContent = 'Editor init failed: ' + err.message;
            }
          }

          async function runCpl(block) {
            const output= block.querySelector('.cpl-runner-output');
            const runButton= block.querySelector('[data-action="run"]');
            const editor= editors.get(block);
            if (!output || !runButton || !editor) return;
        
            runButton.disabled= true;
            output.classList.remove('is-error');
            output.textContent= 'Running...';
        
            const code= editor.getValue();
            const customRunner= window.CPL_RUNNER;
            const backendUrl= window.CPL_RUNNER_URL || '/cpl/run';
        
            try {
              if (customRunner && typeof customRunner.run === 'function') {
                const result= await customRunner.run({ lang: 'cpl', code, block, editor });
        
                if (typeof result === 'string') {
                  output.textContent= result || 'Execution finished with empty output.';
                } else if (result && typeof result === 'object') {
                  const parts= [];
                  if (result.stdout) parts.push(result.stdout);
                  if (result.stderr) parts.push(result.stderr);
                  if (result.result && !parts.length) {
                    parts.push(typeof result.result === 'string' ? result.result : JSON.stringify(result.result, null, 2));
                  }
                  output.textContent= parts.join('\n') || 'Execution finished with empty output.';
                } else {
                  output.textContent= 'Execution finished.';
                }
                return;
              }

              let response = null;
              const payload = { lang: 'cpl', code };

              try {
                response= await fetch(backendUrl, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(payload)
                });
              } catch (networkError) {
                if (window.CPL_RUNNER_STUB && typeof window.CPL_RUNNER_STUB === 'function') {
                  const stubResult = await window.CPL_RUNNER_STUB(payload, networkError);
                  output.textContent = stubResult.stdout || 'Backend stub completed.';
                  return;
                }
                throw networkError;
              }
        
              let data= null;
              try {
                data= await response.json();
              } catch (e) {
                data= null;
              }
        
              if (!response.ok) {
                if ((response.status === 404 || response.status === 405) && window.CPL_RUNNER_STUB && typeof window.CPL_RUNNER_STUB === 'function') {
                  const stubResult = await window.CPL_RUNNER_STUB(payload);
                  output.textContent = stubResult.stdout || 'Backend stub completed.';
                  return;
                }
                const message=
                  (data && (data.error || data.stderr || data.message)) ||
                  `Request failed with status ${response.status}`;
                throw new Error(message);
              }
        
              const parts= [];
              if (data) {
                if (data.stdout) parts.push(data.stdout);
                if (data.stderr) parts.push(data.stderr);
                if (data.result && !parts.length) {
                  parts.push(typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2));
                }
              }
        
              output.textContent= parts.join('\n') || 'Execution finished with empty output.';
            } catch (err) {
              output.classList.add('is-error');
              output.textContent= 'Run failed: ' + err.message;
            } finally {
              runButton.disabled= false;
            }
          }

          function bindRunnerActions(block) {
            if (!block || block.dataset.bound === '1') return;
            block.dataset.bound = '1';

            const formatButton = block.querySelector('[data-action="format"]');
            const runButton = block.querySelector('[data-action="run"]');

            if (formatButton) {
              formatButton.addEventListener('click', function() {
                const editor = editors.get(block);
                if (!editor) return;
                editor.setValue(simpleFormat(editor.getValue()));
              });
            }

            if (runButton) {
              runButton.addEventListener('click', function() {
                runCpl(block);
              });
            }
          }

          hook.doneEach(function() {
            document.querySelectorAll('.cpl-runner').forEach(block => {
              bindRunnerActions(block);
              initRunner(block);
            });
          });
        },

        function(hook) {
          hook.doneEach(function() {
            setTimeout(function() {
              renderBenchmarkCharts();
            }, 0);
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
